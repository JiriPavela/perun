[mypy]
disallow_incomplete_defs = True
disallow_any_generics = True
no_implicit_optional = True
no_implicit_reexport = True
strict_equality = True
warn_redundant_casts = True
warn_unused_ignores = True

# These will require us to type annotate the whole codebase
# disallow_untyped_defs = True
# disallow_untyped_calls = True

# Switch to strict typing when we finish type annotations
# strict = True

[mypy-networkx.*]
# Networkx developers are working on static type hints for the library, however, they are not
# available yet
ignore_missing_imports = True

[mypy-demandimport.*]
ignore_missing_imports = True